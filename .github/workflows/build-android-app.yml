# Builds the WLED Remote Android app and puts it on the "android-app" release,
# at a link that never changes:
#   https://github.com/<owner>/<repo>/releases/download/android-app/WLED-Remote.apk
name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the app
        run: gradle -p android --no-daemon assembleRelease

      - name: Publish it on the android-app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk WLED-Remote.apk
          if ! gh release view android-app >/dev/null 2>&1; then
            gh release create android-app --title "WLED Remote for Android" --notes "Download WLED-Remote.apk below on your Android phone and open it to install. The first time, Android asks you to allow installing apps from your browser. This file is rebuilt every time the app changes."
          fi
          gh release upload android-app WLED-Remote.apk --clobber
